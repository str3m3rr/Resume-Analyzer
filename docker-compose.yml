services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - START_LOCAL_REDIS=false
      - START_CELERY=false
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend

  interview-gateway:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install --omit=dev && npm start"
    volumes:
      - ./interview-service:/app
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - PYTHON_API_URL=http://backend:8000
    depends_on:
      - backend

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  worker:
    build: ./backend
    command: celery -A tasks worker --loglevel=info --concurrency=1 --pool=solo
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - backend