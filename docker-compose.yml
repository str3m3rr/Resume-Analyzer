services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
      - START_LOCAL_REDIS=false
      - START_CELERY=false
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    env_file:
      - ./backend/.env
    depends_on:
      - redis

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  worker:
    build: ./backend
    command: celery -A tasks worker --loglevel=info --concurrency=1 --pool=solo
    volumes:
      - ./backend:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - GROQ_API_KEY=${GROQ_API_KEY:-}
    env_file:
      - ./backend/.env
    depends_on:
      - redis
      - backend